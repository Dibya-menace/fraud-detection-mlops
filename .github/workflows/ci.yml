name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  HF_SPACE: DibyaIsHere554/fraud-detection-mlops

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fraud-api .
      - name: Run container
        run: docker run -d --name fraud -p 7860:7860 fraud-api
      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:7860/docs > /dev/null && exit 0
            sleep 2
          done
          docker logs fraud
          exit 1
      - name: Smoke test /predict
        run: python scripts/smoke_test.py http://localhost:7860

  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub
      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/deploy_hf.py